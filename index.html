<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IsNotOkay - a space to find your okay</title>
    <meta
      name="description"
      content="A peer support community for people who are not okay and need a space to find their okay. No filters, no highlight reels, no toxic positivity."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      FONTS, split by theme.

      LIGHT (whimsy):  Fraunces headings, Quicksand body.
                       Quicksand is the Madlib project's font. Soft, round,
                       friendly, genuinely easy to read.
      DARK  (hacker):  Syne headings, Space Grotesk body, JetBrains Mono.
      BOTH:            Rubik Glitch for the hero headline only.

      Weights are kept tight on purpose. Every extra weight is another file
      a phone on bad signal has to download.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Quicksand:wght@400;500;600;700&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Rubik+Glitch&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
